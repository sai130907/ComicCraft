<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft - Export Successful
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

    <style>

        .success-card {
            max-width: 650px;

            margin: 70px auto;

            background: white;

            border-radius: 22px;

            padding: 45px 35px;

            text-align: center;

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.08);

            border: 1px solid #eee;
        }

        .success-icon {
            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #ede9fe;

            font-size: 2.5rem;
        }

        .success-card h1 {
            margin-bottom: 12px;

            font-size: 2.2rem;

            color: #111827;
        }

        .success-card p {
            color: #6b7280;

            margin-bottom: 25px;
        }

        .success-actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .success-button {
            display: inline-block;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 12px;

            font-weight: 800;
        }

        .download-button {
            background: #7c3aed;

            color: white;
        }

        .home-button {
            background: white;

            color: #374151;

            border: 1px solid #d1d5db;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🎨 ComicCraft
        </div>

        <div class="nav-subtitle">
            AI Comic Story Creator
        </div>

    </header>


    <!-- Main -->

    <main class="container">

        <section class="success-card">


            <div class="success-icon">
                ✅
            </div>


            <h1>
                Export Successful!
            </h1>


            <p>
                Your ComicCraft comic has been
                successfully exported as a PDF.
            </p>


            <div class="success-actions">


                {% if pdf_path %}

                <a
                    href="{{ pdf_path }}"
                    class="success-button download-button"
                    download
                >
                    📥 Download PDF
                </a>

                {% endif %}


                <a
                    href="/"
                    class="success-button home-button"
                >
                    🏠 Create Another Comic
                </a>


            </div>


        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ComicCraft
        </p>

        <p>
            AI Comic Story Creator
        </p>

    </footer>


</body>

</html>
